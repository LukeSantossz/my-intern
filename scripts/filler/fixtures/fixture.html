<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture form</title>
  </head>
  <body>
    <!-- Local stand-in for the real portal's form, used by the hermetic tests.
         It exposes just enough surface to assert fills, attachments, and submits
         without any network or live site. -->
    <form id="form">
      <input id="nome" name="nome" type="text" />
      <input id="email" name="email" type="text" />
      <input id="anexo" name="anexo" type="file" />
      <button id="enviar" type="submit">Enviar</button>
    </form>
    <div id="fileinfo"></div>
    <div id="submitted"></div>
    <script>
      document.getElementById("anexo").addEventListener("change", function () {
        var file = this.files[0];
        document.getElementById("fileinfo").textContent = file
          ? file.name + ":" + file.size
          : "";
      });
      document.getElementById("form").addEventListener("submit", function (e) {
        e.preventDefault();
        document.getElementById("submitted").textContent = "SUBMITTED";
      });
    </script>
  </body>
</html>
